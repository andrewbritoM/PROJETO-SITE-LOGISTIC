<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LOGISTIC</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >
</head>
<body>

  <div class="app">

    <header class="topbar">

      <div class="logo">

        <i class="fa-solid fa-truck-fast"></i>

        <span>LOGISTIC</span>

      </div>

      <button class="route-btn">
        Digite sua rota
      </button>

    </header>


    <section class="hero">

      <h1>
        Bem Vindo De Volta!
      </h1>

      <p>
        Logistic ajudando sempre no trânsito
      </p>

      <div class="search-box">

        <input
          type="text"
          id="pontos"
          placeholder="Coloque a localização"
        >

      </div>

    </section>


    <section class="offers">

      <h3>Our offerings</h3>

      <div class="cards">

        <div class="card">

          <i class="fa-solid fa-bolt"></i>

          <p>Caminho mais rápido</p>

        </div>

        <div class="card">

          <i class="fa-solid fa-globe"></i>

          <p>Saiba mais sobre o trânsito</p>

        </div>

        <div class="card">

          <i class="fa-regular fa-shield"></i>

          <p>Rota mais segura</p>

        </div>

      </div>

    </section>


    <section class="links">

      <a href="#">Contato</a>
      <a href="#">Social</a>
      <a href="#">Localização</a>
      <a href="#">Termos Legais</a>

    </section>


    <section class="map-area">

      <img
        src="https://maps.googleapis.com/maps/api/staticmap?center=Sao+Paulo&zoom=13&size=900x400&maptype=roadmap&markers=color:red%7CSao+Paulo"
        alt="Mapa"
      >

    </section>


    <section class="result-section">

      <button class="calculate-btn" onclick="calcularRota()">
        Calcular Melhor Rota
      </button>

      <div class="resultado" id="resultado">

        Aguardando processamento...

      </div>

    </section>

  </div>

  <script src="script.js"></script>

</body>
</html>
